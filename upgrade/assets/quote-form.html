<form class="cpp-quote-form" data-cpp-upgrade novalidate>
  <fieldset class="cpp-q-block">
    <legend>What do you need?</legend>
    <p class="cpp-q-help">Add each product with the size or details you buy and an estimated quantity.</p>
    <div class="cpp-lines" aria-live="polite">
      <div class="cpp-line">
        <div class="cpp-f cpp-f--product">
          <label for="cpp-q-product-1">Product</label>
          <select id="cpp-q-product-1" name="product" data-cpp-products required>
            <option value="">Choose a product…</option>
          </select>
        </div>
        <div class="cpp-f cpp-f--details">
          <label for="cpp-q-details-1">Size / details</label>
          <input id="cpp-q-details-1" name="details" type="text" placeholder="e.g. 12oz, 98mm lids">
        </div>
        <div class="cpp-f cpp-f--qty">
          <label for="cpp-q-qty-1">Quantity</label>
          <input id="cpp-q-qty-1" name="qty" type="number" inputmode="numeric" min="1" step="1" placeholder="10">
        </div>
        <div class="cpp-f cpp-f--unit">
          <label for="cpp-q-unit-1">Unit</label>
          <select id="cpp-q-unit-1" name="unit">
            <option>Cases</option>
            <option>Pallets</option>
            <option>Truckloads</option>
          </select>
        </div>
        <button type="button" class="cpp-line-remove" aria-label="Remove this product" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
    </div>
    <button type="button" class="cpp-add-line">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add Another Product
    </button>
  </fieldset>

  <fieldset class="cpp-q-block">
    <legend>Your details</legend>
    <div class="cpp-grid">
      <div class="cpp-f"><label for="cpp-q-name">Full name <span aria-hidden="true">*</span></label><input id="cpp-q-name" name="name" type="text" autocomplete="name" required></div>
      <div class="cpp-f"><label for="cpp-q-company">Company <span aria-hidden="true">*</span></label><input id="cpp-q-company" name="company" type="text" autocomplete="organization" required></div>
      <div class="cpp-f"><label for="cpp-q-email">Work email <span aria-hidden="true">*</span></label><input id="cpp-q-email" name="email" type="email" autocomplete="email" required></div>
      <div class="cpp-f"><label for="cpp-q-phone">Phone</label><input id="cpp-q-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel"></div>
      <div class="cpp-f"><label for="cpp-q-zip">Ship-to ZIP code</label><input id="cpp-q-zip" name="zip" type="text" inputmode="numeric" autocomplete="postal-code" maxlength="10"></div>
      <div class="cpp-f"><label for="cpp-q-freq">How often do you order?</label>
        <select id="cpp-q-freq" name="frequency">
          <option>One-time order</option>
          <option>Weekly</option>
          <option>Monthly</option>
          <option>Quarterly</option>
        </select>
      </div>
      <div class="cpp-f cpp-f--wide"><label for="cpp-q-notes">Anything else we should know?</label><textarea id="cpp-q-notes" name="notes" rows="4" placeholder="Brands you use now, delivery timing, private label…"></textarea></div>
    </div>
    <input type="text" name="_honey" class="cpp-hp" tabindex="-1" autocomplete="off" aria-hidden="true">
  </fieldset>

  <div class="cpp-q-actions">
    <button type="submit" class="elementor-button cpp-q-submit"><span class="elementor-button-text">Request a Quote</span></button>
    <p class="cpp-q-fine">Prefer to talk? Call <a href="tel:+18449008804">(844) 900-8804</a> or email <a href="mailto:info@crownplasticandpaper.com">info@crownplasticandpaper.com</a>.</p>
  </div>
</form>
