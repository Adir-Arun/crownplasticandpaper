name: Snapshot live site
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Mirror and localize
        run: bash build.sh
      - name: Commit snapshot to site-source branch
        run: |
          git config user.name "site-snapshot-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B site-source
          git add -f site
          git commit -q -m "Snapshot of www.crownplasticandpaper.com ($(date -u +%Y-%m-%d))" || echo "no changes"
          git push -f origin site-source
